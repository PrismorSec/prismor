# Benign side of the policy benchmark corpus (scripts/bench_policy.py).
#
# Ordinary development traffic an agent produces every day. Every case is
# expected to be allowed; a block here is a false positive, a warn is noise.
# Hosts are documentation sites or reserved names (example.com, *.invalid,
# 192.0.2.x). No secrets: anything credential-shaped is a placeholder.
#
# Case ids are "benign/<group>/<8 hex of sha1(event json)>", so adding or
# reordering cases never renames an existing one.
