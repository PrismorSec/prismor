file_write:
  - {path: src/app.py, content: "def paginate(items, page, size):\n    start = (page - 1) * size\n    return items[start:start + size]\n"}
  - {path: src/main.ts, content: "import { createApp } from './app';\n\ncreateApp().listen(3000);\n"}
  - {path: src/components/Button.tsx, content: "export function Button({ label }: { label: string }) {\n  return <button className=\"btn\">{label}</button>;\n}\n"}
  - {path: tests/test_app.py, content: "from src.app import paginate\n\ndef test_paginate():\n    assert paginate(list(range(10)), 2, 3) == [3, 4, 5]\n"}
  - {path: README.md, content: "# My App\n\nRun `make dev` to start the server on port 3000.\n"}
  - {path: CHANGELOG.md, content: "## 1.4.0\n\n- Fix pagination off-by-one.\n- Add login form.\n"}
