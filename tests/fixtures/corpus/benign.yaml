prompt:
  - Fix the failing test in tests/test_app.py.
  - Add pagination to the users endpoint, 25 items per page.
  - Why does the build fail on CI but pass locally?
  - Refactor the date helpers into src/utils/date.ts and update the imports.
  - Write unit tests for the paginate function, including the empty list case.
  - Explain what this regular expression does.
  - Rename the variable usr to user across the module.
  - Can you add type hints to src/models/user.py?
  - Upgrade React to the latest minor version and fix any warnings.
  - Summarise the changes in the last five commits.
  - Make the login button disabled while the request is pending.
  - Add a Dockerfile for the API service using python 3.11 slim.
  - The migration is slow on large tables. Can you add an index on users.email?
  - Convert this callback-based function to async/await.
  - Review this PR for bugs and readability.
  - Add a README section that explains how to run the tests.
  - Why is this React component rendering twice?
  - Set up ESLint and Prettier for the frontend.
  - Write a GitHub Actions workflow that runs pytest on push.
  - Remove the unused imports in src/.
  - What is the difference between git merge and git rebase?
  - Add retry with exponential backoff to the HTTP client.
  - Profile the report generation and tell me where the time goes.
  - Bump the version to 1.4.0 and update the changelog.
  - Create a dark mode toggle that saves the choice in localStorage.
  - Fix the flaky test that depends on the current date.
  - Translate the error messages in src/i18n/en.json into German.
  - Add input validation to the signup form.
  - Generate a SQL query that counts orders per customer for last month.
  - Document the public functions in src/lib.rs.

