[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prismor"
dynamic = ["version"]
description = "Runtime security for AI coding agents: policy enforcement, secret prevention, and supply-chain blocking."
readme = "PYPI.md"
requires-python = ">=3.8"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Prismor Security", email = "hello@prismor.dev" }]
keywords = [
    "security",
    "ai-agents",
    "llm",
    "prompt-injection",
    "supply-chain",
    "claude-code",
    "policy-enforcement",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pyyaml>=6.0",
    "tomli>=1.1.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["build", "pytest", "cryptography>=41"]
# Ed25519 receipt signing for enrolled devices (tamper-evident + non-repudiable
# telemetry receipts). Optional: without it, telemetry falls back to the keyless
# hash chain. `pip install "prismor[signing]"`.
signing = ["cryptography>=41"]
# LLM layer of the semantic prompt-injection guard on hosts without the Claude
# Code CLI: routes to any provider via litellm. `pip install "prismor[semantic]"`.
semantic = ["litellm>=1.40"]
# Framework adapters ship inside this package (prismor.<framework>);
# the extras just pull the framework itself so `pip install "prismor[langchain]"`
# is a one-liner. See adapters/ for the sources and docs/frameworks-*.
langchain = ["langchain-core>=0.2"]
crewai = ["crewai>=0.30"]
openai-agents = ["openai-agents>=0.0.1"]
browser-use = ["browser-use>=0.1.0"]
pydantic-ai = ["pydantic-ai-slim>=0.1"]
autogen-core = ["autogen-core>=0.4"]
agno = ["agno>=1.0"]
semantic-kernel = ["semantic-kernel>=1.0"]
google-adk = ["google-adk>=1.0"]
beeai = ["beeai-framework>=0.1"]
# Live-verified separately from the rest of this list, against an
# authenticated Claude Code CLI session rather than the shared OpenAI key
# (the SDK needs real Anthropic auth to run at all) — see
# prismor.claude_agent_sdk's module docstring and
# adapters/claude-agent-sdk/README.md for the verification methodology.
claude-agent-sdk = ["claude-agent-sdk>=0.1"]
frameworks = [
    "langchain-core>=0.2",
    "crewai>=0.30",
    "openai-agents>=0.0.1",
    "browser-use>=0.1.0",
    "pydantic-ai-slim>=0.1",
    "autogen-core>=0.4",
    "agno>=1.0",
    "semantic-kernel>=1.0",
    "google-adk>=1.0",
    "beeai-framework>=0.1",
    "claude-agent-sdk>=0.1",
]

[project.urls]
Homepage = "https://prismor.dev"
Repository = "https://github.com/PrismorSec/prismor"
Documentation = "https://docs.prismor.dev"

[project.scripts]
prismor = "prismor.runtime.immunity_cli:main"
immunity = "prismor.runtime.immunity_cli:main"   # deprecated alias — prints a notice; removed in a future release

# Hermes Agent plugin auto-discovery entry point
[project.entry-points."hermes_agent.plugins"]
prismor-cloak = "prismor.runtime.cloaking.hermes_plugin_entry:register"

[tool.hatch.version]
path = "prismor/runtime/__init__.py"

[tool.hatch.build.targets.wheel]
packages = [
    "prismor",
    "supplychain",
    # Framework adapter implementations — bundled so the extras above work
    # without separate adapter packages on PyPI.
    "adapters/langchain/prismor_langchain",
    "adapters/crewai/prismor_crewai",
    "adapters/openai-agents/prismor_openai",
    "adapters/browser-use/prismor_browser_use",
    "adapters/pydantic-ai/prismor_pydantic_ai",
    "adapters/autogen-core/prismor_autogen_core",
    "adapters/agno/prismor_agno",
    "adapters/semantic-kernel/prismor_semantic_kernel",
    "adapters/google-adk/prismor_google_adk",
    "adapters/beeai/prismor_beeai",
    "adapters/claude-agent-sdk/prismor_claude_agent_sdk",
]

# Bundle runtime data into the wheel under prismor/runtime/data/
[tool.hatch.build.targets.wheel.force-include]
# prismor.<framework> namespace shims (PEP 420 — no __init__.py above
# the leaf, so the prismor/ and prismor/ levels stay namespaces).
"adapters/langchain/prismor/langchain/__init__.py" = "prismor/langchain/__init__.py"
"adapters/crewai/prismor/crewai/__init__.py" = "prismor/crewai/__init__.py"
"adapters/openai-agents/prismor/openai/__init__.py" = "prismor/openai/__init__.py"
"adapters/browser-use/prismor/browser_use/__init__.py" = "prismor/browser_use/__init__.py"
"adapters/pydantic-ai/prismor/pydantic_ai/__init__.py" = "prismor/pydantic_ai/__init__.py"
"adapters/autogen-core/prismor/autogen_core/__init__.py" = "prismor/autogen_core/__init__.py"
"adapters/agno/prismor/agno/__init__.py" = "prismor/agno/__init__.py"
"adapters/semantic-kernel/prismor/semantic_kernel/__init__.py" = "prismor/semantic_kernel/__init__.py"
"adapters/google-adk/prismor/google_adk/__init__.py" = "prismor/google_adk/__init__.py"
"adapters/beeai/prismor/beeai/__init__.py" = "prismor/beeai/__init__.py"
"adapters/claude-agent-sdk/prismor/claude_agent_sdk/__init__.py" = "prismor/claude_agent_sdk/__init__.py"
"immunity-agent.pth" = "immunity-agent.pth"
"advisories/immunity-feed.json" = "prismor/runtime/data/advisories/immunity-feed.json"
"advisories/immunity-feed.json.sig" = "prismor/runtime/data/advisories/immunity-feed.json.sig"
"keys/public.pub" = "prismor/runtime/data/keys/public.pub"
"templates/policy-tests-owasp.yaml" = "prismor/runtime/data/templates/policy-tests-owasp.yaml"
"templates/CLAUDE.md.template" = "prismor/runtime/data/templates/CLAUDE.md.template"
"prismor/runtime/cloaking/hermes-plugin/plugin.yaml" = "prismor/runtime/data/cloaking/hermes-plugin/plugin.yaml"
"prismor/runtime/cloaking/hermes-plugin/__init__.py" = "prismor/runtime/data/cloaking/hermes-plugin/__init__.py"
# Bundle the immunity-agent Claude skill (SKILL.md + its docs/, minus the heavy
# unreferenced demo.gif) so `prismor setup` can install it into a workspace's
# .claude/skills/ directory. Files are listed explicitly — a `docs/` directory
# mapping would drag in demo.gif (force-include ignores wheel `exclude`).
"SKILL.md" = "prismor/runtime/data/SKILL.md"
"docs/agentic-architecture-review.md" = "prismor/runtime/data/docs/agentic-architecture-review.md"
"docs/architecture.md" = "prismor/runtime/data/docs/architecture.md"
"docs/attestation-bundle.md" = "prismor/runtime/data/docs/attestation-bundle.md"
"docs/audit-trail.md" = "prismor/runtime/data/docs/audit-trail.md"
"docs/canary.md" = "prismor/runtime/data/docs/canary.md"
"docs/cli-reference.md" = "prismor/runtime/data/docs/cli-reference.md"
"docs/connecting-to-the-platform.md" = "prismor/runtime/data/docs/connecting-to-the-platform.md"
"docs/dashboard.md" = "prismor/runtime/data/docs/dashboard.md"
"docs/decision-contract.md" = "prismor/runtime/data/docs/decision-contract.md"
"docs/deploy-docker.md" = "prismor/runtime/data/docs/deploy-docker.md"
"docs/docker.md" = "prismor/runtime/data/docs/docker.md"
"docs/enterprise-tool-access.md" = "prismor/runtime/data/docs/enterprise-tool-access.md"
"docs/frameworks-agno.md" = "prismor/runtime/data/docs/frameworks-agno.md"
"docs/frameworks-autogen-core.md" = "prismor/runtime/data/docs/frameworks-autogen-core.md"
"docs/frameworks-beeai.md" = "prismor/runtime/data/docs/frameworks-beeai.md"
"docs/frameworks-browser-use.md" = "prismor/runtime/data/docs/frameworks-browser-use.md"
"docs/frameworks-claude-agent-sdk.md" = "prismor/runtime/data/docs/frameworks-claude-agent-sdk.md"
"docs/frameworks-crewai.md" = "prismor/runtime/data/docs/frameworks-crewai.md"
"docs/frameworks-google-adk.md" = "prismor/runtime/data/docs/frameworks-google-adk.md"
"docs/frameworks-langchain.md" = "prismor/runtime/data/docs/frameworks-langchain.md"
"docs/frameworks-mastra.md" = "prismor/runtime/data/docs/frameworks-mastra.md"
"docs/frameworks-openai-agents.md" = "prismor/runtime/data/docs/frameworks-openai-agents.md"
"docs/frameworks-overview.md" = "prismor/runtime/data/docs/frameworks-overview.md"
"docs/frameworks-pydantic-ai.md" = "prismor/runtime/data/docs/frameworks-pydantic-ai.md"
"docs/frameworks-semantic-kernel.md" = "prismor/runtime/data/docs/frameworks-semantic-kernel.md"
"docs/frameworks-vercel-ai.md" = "prismor/runtime/data/docs/frameworks-vercel-ai.md"
"docs/governance-surfaces.md" = "prismor/runtime/data/docs/governance-surfaces.md"
"docs/hermes.md" = "prismor/runtime/data/docs/hermes.md"
"docs/iam.md" = "prismor/runtime/data/docs/iam.md"
"docs/inference-hook.md" = "prismor/runtime/data/docs/inference-hook.md"
"docs/installation.md" = "prismor/runtime/data/docs/installation.md"
"docs/learning.md" = "prismor/runtime/data/docs/learning.md"
"docs/live-telemetry.md" = "prismor/runtime/data/docs/live-telemetry.md"
"docs/llm-proxy.md" = "prismor/runtime/data/docs/llm-proxy.md"
"docs/mcp-gateway.md" = "prismor/runtime/data/docs/mcp-gateway.md"
"docs/memory-integrity.md" = "prismor/runtime/data/docs/memory-integrity.md"
"docs/modes.md" = "prismor/runtime/data/docs/modes.md"
"docs/n8n.md" = "prismor/runtime/data/docs/n8n.md"
"docs/network-isolation.md" = "prismor/runtime/data/docs/network-isolation.md"
"docs/openclaw.md" = "prismor/runtime/data/docs/openclaw.md"
"docs/policy-layers-and-exemptions.md" = "prismor/runtime/data/docs/policy-layers-and-exemptions.md"
"docs/prismor-runtime.md" = "prismor/runtime/data/docs/prismor-runtime.md"
"docs/scoped-agent.md" = "prismor/runtime/data/docs/scoped-agent.md"
"docs/sdk-integration.md" = "prismor/runtime/data/docs/sdk-integration.md"
"docs/semantic-guard.md" = "prismor/runtime/data/docs/semantic-guard.md"
