"docs/tool-tags.md" = "prismor/runtime/data/docs/tool-tags.md"
"docs/transcript-ingest.md" = "prismor/runtime/data/docs/transcript-ingest.md"

[tool.hatch.build.targets.sdist]
include = [
    "prismor/runtime/",
    "supplychain/",
    # The wheel is built FROM the sdist in CI — the bundled framework adapters
    # (impl modules + namespace shims) must ride along or the published wheel
    # ships shims that import nothing (the 1.14.1 bug).
    "adapters/",
    "immunity-agent.pth",
    "advisories/immunity-feed.json",
    "advisories/immunity-feed.json.sig",
    "keys/public.pub",
    "templates/",
    # Bundled Claude skill — needed in the sdist so the wheel's force-include
    # (build_wheel runs from the unpacked sdist) can find them. Only the .md
    # files; the heavy unreferenced docs/demo.gif stays out.
    "SKILL.md",
    "docs/*.md",
    "PYPI.md",
    "LICENSE",
]
