[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prismor-agent-framework"
version = "0.1.0"
description = "Prismor adapter for Microsoft Agent Framework — per-user runtime tool-call policy for production agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Prismor" }]
keywords = ["agent-framework", "microsoft", "security", "policy", "guardrail", "prismor"]

dependencies = [
    "prismor>=1.13.0",
]

[project.optional-dependencies]
agent-framework = ["agent-framework>=1.0"]

[tool.hatch.build.targets.wheel]
packages = ["prismor_agent_framework", "prismor"]
