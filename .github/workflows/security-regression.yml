name: Security regression

# Runs the cloaking + policy test suite on every push and PR, so a change to a
# hook script or a policy rule cannot silently reopen a scrubbed/blocked path.
# This is the CI gate behind the secret-cloaking and policy-enforcement layers.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install jq (cloaking hooks are shell)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq
      - name: Install pytest
        # `cryptography` is the optional [signing] extra. Installed here so the
        # receipt-schema tests actually run instead of skipping: they execute
        # the verifier published in docs/telemetry-receipts.md, which is how
        # that spec is kept honest.
        run: python3 -m pip install --quiet pytest cryptography
      - name: Verify integration registry
        # Catches registry.yaml drift vs SURFACES/BLOCKING enums and matrix sync
        # (see TODO.md: verify_registry.sh in CI). Needs PyYAML for the YAML load path.
        run: |
          python3 -m pip install --quiet pyyaml
          bash scripts/verify_registry.sh
      - name: Run security regression suite
        run: bash scripts/run_security_tests.sh

  # Prismor's hooks are stored as shell strings and run by the agent's own
  # shell — cmd.exe on Windows, where a `PYTHONPATH=... python ...` prefix is
  # not a variable assignment. That failure is silent (hook failure is
  # non-blocking), so it can only be caught by actually installing a hook on
  # Windows and dispatching through it. Everything else here runs on Linux.
  windows-hooks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --quiet pytest pyyaml
      - name: Hook install + dispatch under cmd.exe
        run: python -m pytest tests/test_hooks_windows.py -q -p no:randomly
      - name: Dogfood hook configs under cmd.exe, PowerShell and Git Bash
        run: python -m pytest tests/test_dogfood_configs.py -q -p no:randomly -rs
      - name: Run the generated hook command through cmd.exe verbatim
        shell: cmd
        run: python scripts/windows_hook_smoke.py
      - name: Install prismor from a built wheel
        # A source checkout cannot resolve the prismor.<framework> shims, and
        # `prismor setup` is what exercised the cp1252 and fcntl breakage.
        run: |
          python -m pip install --quiet build cryptography
          python -m build --wheel --outdir dist
          python -m pip install --quiet (Get-ChildItem dist/*.whl).FullName
      - name: prismor setup end to end
        env:
          PRISMOR_NO_UPDATE_CHECK: "1"
        run: |
          # pwsh 7.4 turns any non-zero native exit code into a terminating
          # error under the runner's $ErrorActionPreference='Stop', so a
          # correctly-blocking `prismor check` (exit 2) killed the step before
          # the assertion could read $LASTEXITCODE.
          $PSNativeCommandUseErrorActionPreference = $false
          New-Item -ItemType Directory -Force -Path ws | Out-Null
          Set-Location ws
          prismor setup --non-interactive --mode enforce --recommended --agents claude --scope global --no-backfill
          if ($LASTEXITCODE -ne 0) { throw "prismor setup failed with $LASTEXITCODE" }
          prismor check ((-join @('chm','od ','7','77 /tmp/build')))
          $code = $LASTEXITCODE
          Write-Host "check exit: $code"
          if ($code -ne 2) { throw "expected the destructive-command block (exit 2), got $code" }
          # The runner appends `exit $LASTEXITCODE` to every pwsh step, so the
          # blocked check's own exit 2 would fail the step it just satisfied.
          exit 0
