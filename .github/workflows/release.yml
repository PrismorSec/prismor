name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # create GitHub Release
  id-token: write   # OIDC token for PyPI trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build prismor
        run: |
          pip install hatchling build
          python -m build --outdir dist

      - name: Sync immunity-agent shim version with prismor
        # The shim's version/dependency floor are hand-maintained in
        # packaging/immunity-agent-shim/pyproject.toml — a manual step that
        # was previously missed on a release, causing "400 File already
        # exists" when PyPI rejected re-uploading the prior version. Derive
        # it from prismor/runtime/__init__.py instead of trusting it stayed
        # in sync.
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' prismor/runtime/__init__.py)
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" packaging/immunity-agent-shim/pyproject.toml
          sed -i "s/prismor>=[0-9][0-9.]*/prismor>=$VERSION/" packaging/immunity-agent-shim/pyproject.toml
          echo "Synced immunity-agent shim to version $VERSION"
          grep -E "^version|prismor>=" packaging/immunity-agent-shim/pyproject.toml

      - name: Build immunity-agent redirect package
        run: python -m build packaging/immunity-agent-shim --outdir dist-shim

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
            dist-shim/*

      - name: Publish prismor to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

      - name: Publish immunity-agent redirect to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-shim
          skip-existing: true

  # The service image (packaging/docker): ghcr.io/prismorsec/prismor, multi-arch.
  # Only after the release job, so an image never exists for a version PyPI
  # does not have. `latest` moves on final releases only (metadata-action's
  # default for semver tags), never on a pre-release.
  docker:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/prismorsec/prismor
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/docker/Dockerfile
          load: true
          tags: prismor:smoke
          cache-to: type=gha,mode=max
      # Healthy only means listening, so the policy is exercised too: a
      # hardened container that cannot write its home still reports healthy.
      - name: Smoke test — version, both surfaces healthy, a real allow and block
        run: |
          want="${GITHUB_REF_NAME#v}"
          got=$(docker run --rm prismor:smoke --version | awk '{print $2}')
          [ "$got" = "$want" ] || { echo "image reports $got, tag is $want"; exit 1; }
          hardened=(--health-interval 2s --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges)
          docker run -d --name proxy "${hardened[@]}" -v proxy_home:/var/lib/prismor prismor:smoke proxy
          docker run -d --name eval "${hardened[@]}" -v eval_home:/var/lib/prismor \
            -e PRISMOR_EVAL_KEY=smoke -p 127.0.0.1:7071:7071 prismor:smoke eval-server
          for c in proxy eval; do
            for _ in $(seq 30); do
              s=$(docker inspect -f '{{.State.Health.Status}}' $c)
              [ "$s" = healthy ] && break
              sleep 2
            done
            [ "$s" = healthy ] || { docker logs $c; echo "$c: $s"; exit 1; }
          done
          verdict() {
            curl -fsS -H 'Authorization: Bearer smoke' -H 'Content-Type: application/json' \
              -d "$1" http://127.0.0.1:7071/v1/evaluate | jq -r .verdict
          }
          [ "$(verdict '{"tool_name":"Bash","arguments":{"command":"echo hi"}}')" = allow ]
          [ "$(verdict '{"tool_name":"Read","event_type":"file_read","arguments":{"file_path":"/home/u/.ssh/id_rsa"}}')" = block ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' -d '{}' http://127.0.0.1:7071/v1/evaluate)" = 401 ]
          if docker run --rm prismor:smoke eval-server; then
            echo "eval-server started without a key"; exit 1
          fi
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push linux/amd64 + linux/arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true

  # MDM installers (packaging/mdm), attached to the same GitHub Release. Each
  # signs when its secrets exist and ships unsigned otherwise; see
  # docs/deploy-jamf.md and docs/deploy-intune.md for what to configure.
  mdm-macos:
    needs: release
    runs-on: macos-latest
    env:
      HAS_SIGNING: ${{ secrets.MACOS_INSTALLER_CERT_P12 != '' && secrets.MACOS_APP_CERT_P12 != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_NOTARY_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: |
          python -m pip install --quiet build
          python -m build --wheel --outdir dist >/dev/null
      - name: Import signing identities
        if: env.HAS_SIGNING == 'true'
        env:
          APP_P12: ${{ secrets.MACOS_APP_CERT_P12 }}
          INSTALLER_P12: ${{ secrets.MACOS_INSTALLER_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"; KCPW=$(uuidgen)
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          for c in APP INSTALLER; do
            v="${c}_P12"; printf '%s' "${!v}" | base64 --decode > "$RUNNER_TEMP/$c.p12"
            security import "$RUNNER_TEMP/$c.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/pkgbuild
            rm -f "$RUNNER_TEMP/$c.p12"
          done
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          app=$(security find-identity -v -p codesigning "$KC" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          inst=$(security find-identity -v "$KC" | grep -o '"Developer ID Installer: [^"]*"' | head -1 | tr -d '"')
          [ -n "$app" ] && [ -n "$inst" ] || { echo "Developer ID Application/Installer identities not found"; exit 1; }
          echo "PRISMOR_CODESIGN_IDENTITY=$app" >> "$GITHUB_ENV"
          echo "PRISMOR_PKG_SIGN_IDENTITY=$inst" >> "$GITHUB_ENV"
      - name: Build the package
        run: bash packaging/mdm/macos/build_pkg.sh dist/*.whl out
      - name: Notarize and staple
        if: env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
        env:
          KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          export APPLE_NOTARY_KEY_PATH="$RUNNER_TEMP/notary.p8"
          printf '%s' "$KEY_P8" | base64 --decode > "$APPLE_NOTARY_KEY_PATH"
          bash packaging/mdm/macos/notarize.sh out/*.pkg
          rm -f "$APPLE_NOTARY_KEY_PATH"
      - name: Checksum
        run: cd out && for f in *.pkg; do shasum -a 256 "$f" > "$f.sha256"; done
      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.pkg
            out/*.pkg.sha256

  mdm-windows:
    needs: release
    runs-on: windows-latest
    env:
      HAS_SIGNING: ${{ secrets.WINDOWS_CODESIGN_PFX != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel and the package
        shell: pwsh
        run: |
          python -m pip install --quiet build
          python -m build --wheel --outdir dist | Out-Null
          python packaging/mdm/windows/build_package.py (Get-ChildItem dist/*.whl).FullName out
      - name: Sign the scripts
        if: env.HAS_SIGNING == 'true'
        shell: powershell
        env:
          PFX_B64: ${{ secrets.WINDOWS_CODESIGN_PFX }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
          $pk = (Get-ChildItem out -Directory -Filter "prismor-*-windows").FullName
          & powershell -NoProfile -ExecutionPolicy Bypass -File packaging/mdm/windows/sign_package.ps1 -Package $pk -PfxPath $pfx -PfxPassword $env:PFX_PASSWORD
          $rc = $LASTEXITCODE; Remove-Item $pfx -Force
          if ($rc -ne 0) { throw "signing failed" }
      - name: Zip and wrap as .intunewin (after signing)
        shell: powershell
        run: |
          $pk = (Get-ChildItem out -Directory -Filter "prismor-*-windows").FullName
          Remove-Item "$pk.zip" -ErrorAction SilentlyContinue
          Compress-Archive -Path "$pk\*" -DestinationPath "$pk.zip"
          & powershell -NoProfile -ExecutionPolicy Bypass -File packaging/mdm/windows/make_intunewin.ps1 -Package $pk -Out out
          if ($LASTEXITCODE -ne 0) { throw "intunewin failed" }
          Get-ChildItem out -File -Include *.zip, *.intunewin -Recurse | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" | Set-Content -Encoding ascii "$($_.FullName).sha256"
          }
      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.zip
            out/*.intunewin
            out/*.sha256
