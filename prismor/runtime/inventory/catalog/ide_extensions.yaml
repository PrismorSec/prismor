# VS Code-family extension ids. ``verified`` is against the Marketplace gallery
# API (publisher.extensionName) on 2026-11-03. Matching is case-insensitive.
# ``codeium.windsurf`` is not a published id; Windsurf's extension is Codeium.codeium.
- id: github.copilot
  name: GitHub Copilot
  vendor: GitHub
  kind: ide_extension
  editor: vscode
  ai_capability: completion
  match: {extension_id: GitHub.copilot}
  source_url: https://marketplace.visualstudio.com/items?itemName=GitHub.copilot
  verified: true
