version: "1.0"

# Prismor governance modes.
#
# A mode is a named, immutable template that COMPILES into the primitives the
# runtime already enforces — it is not a new enforcement path. `prismor mode
# apply <id>` writes:
#
#   .prismor/policy.yaml   settings.default_mode / .egress / .tool_tags /
#                          .sandbox, plus per-rule `mode:` overlays and any
#                          `commands:` compiled into a generated rule.
#   .prismor/agents.yaml   global_deny_tools / global_ask_tools (via
#                          agents.set_tool_policy).
#
# So PolicyEngine.evaluate never learns what a mode is. Add a mode here and it
# works; there is no code to change.
#
# ── Schema ──────────────────────────────────────────────────────────────────
#   name / intent / scenario   prose shown by `mode list` and `mode explain`
#   default_mode               observe | enforce — the fallback for rules that
#                              set no mode of their own
#   enforce_rules              none | floor | all — which rules get
#                              `mode: enforce`. `floor` = Prismor's safety floor
#                              (core rule ids + core block categories), which is
#                              what `prismor setup --recommended` selects.
#   enforce_extra              rule ids to enforce on top of the selector
#   egress / tool_tags / sandbox   written verbatim into settings.*
#   tools.deny / tools.ask     tool TAGS (Bash, WebFetch, Skill, mcp__srv__tool)
#   commands.deny / .ask       regexes over the shell command string, compiled
#                              into one generated rule per action
#   reward / friction          what `mode explain` prints — the honest trade
#   residual_risk              what this mode does NOT stop. Never omit it.
#   friction_index             0-100 operator judgement; coverage is COMPUTED
#                              from the real enforcing-rule count, not asserted

# settings.update() replaces `egress` wholesale (policy_engine._apply_override),
# so a mode that sets egress and omits these would silently drop the default
# cloud-metadata deny list — the classic SSRF pivot. Every mode below that
# enables egress anchors this in.
_metadata_deny: &metadata_deny
  - host: "169.254.169.254"
    reason: "AWS IMDS — hands out instance credentials (IMDSv1/v2)"
  - host: "169.254.169.253"
    reason: "AWS Route 53 resolver — DNS rebinding surface"
  - host: "metadata.google.internal"
    reason: "GCP metadata server — hands out service account credentials"
  - host: "100.100.100.200"
    reason: "Alibaba Cloud metadata endpoint"
  - host: "169.254.0.0/16"
    reason: "link-local block — belt-and-braces catch-all for cloud metadata"

modes:

  # ────────────────────────────────────────────────────────────────────────
  audit-only:
    name: "Audit Only"
    intent: "Baseline telemetry with zero execution risk. Nothing blocks."
    scenario: >-
      Onboarding Prismor into a legacy codebase, or watching a new agent
      (Claude Code, Cursor, Windsurf) for a week to learn what it actually does
      before deciding what to stop. Findings land in the audit trail; the agent
      never notices Prismor is there.
    default_mode: observe
    enforce_rules: none
    egress:
      enabled: false          # unrestricted — no destination check at all
    tool_tags:
      enabled: true
      mode: observe
      inference_enabled: false   # or "untrusted_content then critical_action"
                                 # reads as "no command may follow a read":
                                 # inference tags every shell/write
                                 # critical_action and every read
                                 # untrusted_content. Measured: 2 of 13 routine
                                 # controls blocked with it on.
      rules:
        - "untrusted_content then critical_action -> warn"
    sandbox:
      enabled: false          # host native, unconfined
    tools: {}
    commands: {}
    reward:
      - "Full visibility     : every tool call, command, and destination is recorded."
      - "Zero breakage       : no policy verdict can stop a build or a test run."
      - "Tag telemetry       : trifecta sequences are logged so you can size the risk."
    friction:
      - "Nothing is prevented. This mode is a camera, not a lock."
    residual_risk: >-
      Zero real-time mitigation. An agent under prompt injection can exfiltrate
      secrets over HTTP, run destructive shell commands, or rewrite CI workflow
      files, and Prismor will faithfully record all of it after the fact.
      Security here rests entirely on someone reading the audit trail.
      Prismor's own self-protection rules still enforce — they are not a policy
      choice — so the agent cannot quietly disable this observation.
    friction_index: 0
    recommended_for: "Week-one rollout, legacy repos, measuring before enforcing."
    not_recommended_for: "Anything touching production credentials or customer data."

  # ────────────────────────────────────────────────────────────────────────
  dev-safe:
    name: "Development Safe"
    intent: "GitHub and package registries only. Everything else is blocked."
    scenario: >-
      Everyday feature work, bug fixes, and PR review on GitHub-centric
      projects. git and gh work, npm/pip resolve, tests run — and an agent that
      gets injected cannot reach an arbitrary host to post what it read.
    default_mode: observe
    # `floor` alone leaves `secret-access` observing, so a read of
    # ~/.ssh/id_rsa or .aws/credentials is recorded and allowed. Cheap rule,
    # low false-positive rate, and the mode's whole claim is about secrets.
    enforce_rules: floor
    enforce_extra: [secret-access]
    egress:
      enabled: true
      mode: enforce
      default: deny
      allow_private: true
      resolve: true
      allow:
        - "github.com"
        - "*.github.com"
        - "api.github.com"
        - "codeload.github.com"
        - "objects.githubusercontent.com"
        - "registry.npmjs.org"
        - "pypi.org"
        - "files.pythonhosted.org"
      deny: *metadata_deny
    tool_tags:
      enabled: true
      mode: enforce
      inference_enabled: false   # or "untrusted_content then critical_action"
                                 # reads as "no command may follow a read":
                                 # inference tags every shell/write
                                 # critical_action and every read
                                 # untrusted_content. Measured: 2 of 13 routine
                                 # controls blocked with it on.
      rules:
        - "untrusted_content then critical_action -> block"
    sandbox:
      enabled: true
      mode: enforce
      network: none
      read_only_root: true
      workspace_mount: rw
    tools: {}
    commands:
      deny:
        # NOT curl/wget: the egress allowlist above already decides where they
        # may go, and denying the binary outright refused a fetch from
        # registry.npmjs.org — a destination this same mode allows.
        - '\bnc\b|\bnetcat\b|\bncat\b'
        - '\bsudo\b'
        - '\bssh\b\s+\S+@'
      ask:
        - '\b(npm|pnpm|yarn|bun)\s+(install|add|i)\b'
        - '\b(pip3?|uv)\s+(install|add)\b'
        - '\bcargo\s+add\b'
    reward:
      - "Secret exfiltration : BLOCKED. No route to an arbitrary HTTP endpoint."
      - "Destructive commands: BLOCKED. rm -rf / and privilege escalation denied."
      - "Lethal trifecta     : BLOCKED. Untrusted read then critical action stops."
      - "Supply chain        : GATED. Installs need a human before they run."
    friction:
      - "Network isolation   : docs and APIs outside GitHub/npm/PyPI are unreachable."
      - "Shell capabilities  : curl and wget inside agent scripts will fail."
      - "Dependency changes  : adding a package prompts for approval."
    residual_risk: >-
      Exfiltration through the channels this mode allows. An injected agent can
      still read .env and paste it into a public GitHub issue or PR comment via
      api.github.com, which is on the allowlist by design. Dependency confusion
      through the public registries remains possible — the install gate raises
      the cost but a human clicking through it is still the whole control.
    friction_index: 20
    recommended_for: "Feature branches, PR review, open-source contribution."
    not_recommended_for: "Debugging third-party webhooks or multi-cloud infra setup."

  # ────────────────────────────────────────────────────────────────────────
  trusted-workspace:
    name: "Trusted Workspace"
    intent: "Broad autonomy. Guardrails only on secrets and package installs."
    scenario: >-
      Fast internal work in a closed-source repo you trust: building, running
      microservices under Docker, executing tests, debugging. The agent gets
      room to move; the two things it cannot do casually are install packages
      and read credentials.
    default_mode: observe
    enforce_rules: floor
    enforce_extra:
      - secret-access
      - credential-aggregation
      - credential-staging
      - claude-credential-access
      - dependency-confusion
      - pkg-install-from-url
      - pkg-suspicious-name
    egress:
      enabled: true
      mode: enforce
      default: deny
      allow_private: true     # internal staging APIs and localhost services
      resolve: true
      allow:
        - "github.com"
        - "*.github.com"
        - "registry.npmjs.org"
        - "pypi.org"
        - "files.pythonhosted.org"
        - "crates.io"
        - "proxy.golang.org"
        - "*.docker.io"
        - "*.amazonaws.com"
        - "*.googleapis.com"
        - "*.azure.com"
        - "api.anthropic.com"
        - "api.openai.com"
      deny: *metadata_deny
    tool_tags:
      enabled: true
      mode: enforce
      inference_enabled: false   # or "untrusted_content then critical_action"
                                 # reads as "no command may follow a read":
                                 # inference tags every shell/write
                                 # critical_action and every read
                                 # untrusted_content. Measured: 2 of 13 routine
                                 # controls blocked with it on.
      rules:
        - "untrusted_content then critical_action -> block"
    sandbox:
      enabled: true
      mode: observe           # non-root, workspace-scoped; observe so builds run
      network: bridge
      read_only_root: false
      workspace_mount: rw
    tools: {}
    commands:
      deny:
        - '\bsudo\b'
        - '\bchmod\s+[ugo+]*s\b'
        - '\bsu\s+-'
      ask:
        - '\b(npm|pnpm|yarn|bun)\s+(install|add|i)\b'
        - '\b(pip3?|uv)\s+(install|add)\b'
        - '\bcargo\s+add\b'
        - '\bgem\s+install\b'
    reward:
      - "Credential access   : GATED. .env, ~/.aws, and SSH keys need a human."
      - "Package installs    : GATED. Nothing enters the tree unattended."
      - "Privilege escalation: BLOCKED. sudo, setuid, and su are denied outright."
      - "Data boundary       : BLOCKED. Private data cannot leave via external comms."
    friction:
      - "Approval prompts    : every dependency change stops for consent."
      - "Secret reads        : debugging a credential issue needs prismor unlock."
      - "Egress allowlist    : an unlisted vendor API needs an explicit entry."
    residual_risk: >-
      Code this mode lets the agent execute can still do damage. A malicious
      build script (setup.py, Makefile, npm preinstall) runs with the agent's
      own reach and can alter workspace state outside the protected secret
      paths. Indirect injection sitting in internal code comments or a database
      dump can steer the agent into writing a subtle logic bug or a backdoor,
      which no destination allowlist detects.
    friction_index: 25
    recommended_for: "Trusted internal repos, local microservice and Docker work."
    not_recommended_for: "Repos that ingest untrusted third-party content or PII."

  # ────────────────────────────────────────────────────────────────────────
  regulated-airgap:
    name: "Regulated Airgap"
    intent: "No network, no shell. File edits in the workspace, each approved."
    scenario: >-
      Environments under SOC 2, HIPAA, or the EU AI Act, handling PII, PHI, or
      core IP. The agent reads and edits files inside the workspace root and
      does nothing else. Every write is a decision a human signs off on.
    default_mode: enforce     # no selection: explicit — the full floor blocks
    enforce_rules: all
    egress:
      enabled: true
      mode: enforce
      default: deny
      allow_private: false    # loopback is not a carve-out here
      resolve: true
      allow: []
      deny: *metadata_deny
    tool_tags:
      enabled: true
      mode: enforce
      inference_enabled: false   # or "untrusted_content then critical_action"
                                 # reads as "no command may follow a read":
                                 # inference tags every shell/write
                                 # critical_action and every read
                                 # untrusted_content. Measured: 2 of 13 routine
                                 # controls blocked with it on.
      rules:
        - "untrusted_content then critical_action -> block"
    sandbox:
      enabled: true
      mode: enforce
      network: none
      read_only_root: true
      workspace_mount: rw
      tmpfs:
        - "/tmp:noexec,nosuid,size=64m"
    tools:
      deny:
        - Bash
        - WebFetch
        - WebSearch
      ask:
        - Write
        - Edit
    commands: {}
    reward:
      - "Network egress      : BLOCKED. Nothing leaves the machine, at all."
      - "Shell execution     : BLOCKED. The Bash tool is denied outright."
      - "Every file write    : GATED. No edit lands without human approval."
      - "Audit trail         : Ed25519-signed and hash-chained for evidence."
    friction:
      - "No shell            : the agent cannot run tests, builds, or git."
      - "No documentation    : it cannot look anything up mid-task."
      - "Approval per write  : a ten-file refactor is ten prompts."
    residual_risk: >-
      Friction is itself the risk. A mode this tight is one people route around
      — the realistic failure is a developer running `prismor uninstall-hooks`
      to get through an afternoon, which removes every control at once rather
      than one. And an offline agent is still steerable: poisoned context in a
      repo file needs no network to work, so local logic manipulation survives
      the airgap intact.
    friction_index: 90
    recommended_for: "Regulated repos, PII/PHI handling, review-only analysis."
    not_recommended_for: "Any workflow where the agent has to build or test."

  # ────────────────────────────────────────────────────────────────────────
  ci-agent:
    name: "CI Agent"
    intent: "Unattended pipeline. Nothing can prompt a human, so ambiguity blocks."
    scenario: >-
      An agent running in GitHub Actions, GitLab CI or Jenkins with no one at
      the keyboard. Two things change versus a laptop: an inline approval has
      nobody to ask, so those decisions resolve to a block rather than time
      out; and the destination set is small enough to enumerate, which makes
      deny-by-default egress practical here even where it would be painful
      interactively.
    default_mode: enforce
    enforce_rules: floor
    egress:
      enabled: true
      mode: enforce
      default: deny
      allow_private: true
      allow:
      - '*.github.com'
      - github.com
      - '*.githubusercontent.com'
      - '*.gitlab.com'
      - registry.npmjs.org
      - '*.npmjs.org'
      - pypi.org
      - files.pythonhosted.org
      - crates.io
      - static.crates.io
      - proxy.golang.org
      - '*.docker.io'
      - '*.docker.com'
      - ghcr.io
      - api.anthropic.com
      - api.openai.com
      deny:
      - host: '*'
        ports:
        - 4444
        - 1337
        - 9001
        reason: common reverse-shell ports — no build needs them
    tool_tags:
      enabled: true
      mode: enforce
      inference_enabled: false
    settings:
      inspect_execution_targets: true
      execution_target_action: enforce
      supply_chain_install_check: true
      supply_chain_transitive_scan: true
      mcp_transport_action: block
      data_boundary:
        enabled: true
        mode: enforce
        classes:
          email:
            external: warn
            untrusted: block
            unknown: warn
          phone:
            external: warn
            untrusted: block
            unknown: warn
          ssn:
            trusted: block
            external: block
            untrusted: block
            unknown: block
          card:
            trusted: block
            external: block
            untrusted: block
            unknown: block
          iban:
            trusted: warn
            external: block
            untrusted: block
            unknown: block
          secret:
            trusted: warn
            external: block
            untrusted: block
            unknown: block
          file:
            external: warn
            untrusted: block
            unknown: warn
    enforce_extra:
    - pkg-install-from-url
    - npm-git-install
    - execute-vendored-script
    - lockfile-direct-edit
    - persistence-cron
    - persistence-systemd
    - persistence-shell-profile
    - persistence-git-hooks
    - tls-verification-disabled
    rules:
    - id: network-exfil-tool
      mode: observe
    reward:
      - "Release integrity   : installs from a URL or a git ref are blocked."
      - "Runner persistence  : cron, systemd and shell-profile edits blocked."
      - "Egress              : deny-by-default over registries and VCS only."
      - "Script indirection  : `bash deploy.sh` is screened by its contents."
    friction:
      - "Unlisted hosts      : a destination not on the list fails the build."
      - "No inline approval  : anything ambiguous resolves to a block."
      - "Insecure MCP        : a cleartext remote server fails the run."
    residual_risk: >-
      Everything reachable through the destinations a build legitimately
      needs. `api.github.com` is on the allowlist, so a token can still be
      pushed to an attacker-controlled repo the runner has write access to,
      and a malicious package already resolved into the lockfile installs
      exactly as an honest one does — the URL and git-ref gates raise the cost
      of getting it in, they do not audit what is already pinned.
    friction_index: 35
    recommended_for: "GitHub Actions, GitLab CI, Jenkins, any unattended runner."
    not_recommended_for: "Interactive laptop work — the block-on-ambiguity trade is wrong there."

  # ────────────────────────────────────────────────────────────────────────
  web-research:
    name: "Web Research"
    intent: "Reads the open web. Every fetched page is treated as hostile input."
    scenario: >-
      An agent that browses, scrapes, or reads issues, tickets and email and
      feeds them back into its own context. The threat is not the agent, it is
      the page: a README or a support ticket can carry instructions the model
      cannot distinguish from yours. The defence is not detecting the
      injection — it is bounding what a session may DO after reading untrusted
      input, which the tag rules do by sequence rather than by wording.
    default_mode: enforce
    enforce_rules: floor
    egress:
      enabled: true
      mode: enforce
      default: allow
      deny:
      - host: 169.254.0.0/16
        reason: cloud metadata / link-local — an SSRF pivot, never research
      - host: '*.pastebin.com'
        reason: classic exfil sink
      - host: '*.requestbin.com'
        reason: classic exfil sink
      - host: '*.ngrok.io'
        reason: ad-hoc tunnel endpoint
      - host: '*.trycloudflare.com'
        reason: ad-hoc tunnel endpoint
      - host: '*.burpcollaborator.net'
        reason: out-of-band exfil canary
      - host: '*.oast.fun'
        reason: out-of-band exfil canary
    tool_tags:
      enabled: true
      mode: enforce
      defaults_enabled: true
      inference_enabled: false
      rules:
      - untrusted_content then critical_action -> block
      - untrusted_content then egress.offlist -> block
      - untrusted_content then egress.denied -> block
      - untrusted_content then data.secret -> block
      - untrusted_content then data.email with dest.external -> block
      tags: {}
    settings:
      inspect_execution_targets: true
      execution_target_action: enforce
      semantic_guard:
        enabled: true
        mode: auto
      data_boundary:
        enabled: true
        mode: enforce
    enforce_extra:
    - prompt-injection
    - prompt-injection-hidden
    - memory-embedded-directive
    - memory-exfil-directive
    - memory-tool-policy-override
    - fetch-then-execute
    - remote-execution
    reward:
      - "Injection sequence  : untrusted read then critical action is blocked."
      - "Exfil after a read  : off-list or denied destinations blocked in-session."
      - "Fetch-then-execute  : `curl … | bash` from a page is blocked."
      - "Paraphrased attacks : the contextual layer catches what regex misses."
    friction:
      - "Deny-listed sinks   : paste sites and tunnel endpoints are unreachable."
      - "Consequential tools : a tagged send/publish tool is blocked after a fetch."
      - "Script indirection  : running a downloaded installer is blocked."
    residual_risk: >-
      The open web itself. Egress stays `default: allow` because a research
      agent has to reach hosts you cannot enumerate in advance, so a page on a
      host nobody thought to deny is still reachable and still readable. The
      sequence rules bound what the agent may do afterwards; they do not stop
      it being persuaded of something false and writing that into your notes.
    friction_index: 20
    recommended_for: "Research, competitive analysis, docs and ticket triage."
    not_recommended_for: "Agents holding production credentials — use production-ops."

  # ────────────────────────────────────────────────────────────────────────
  regulated-data:
    name: "Regulated Data"
    intent: "PHI, cardholder data or customer PII. Sensitive values may not leave."
    scenario: >-
      A codebase under HIPAA, PCI-DSS or GDPR. Where the other modes spend
      their controls on the machine, this one spends them on the data: what an
      outbound call CARRIES, not just which host it reaches. The shape it
      defends against is mundane — an agent pastes a row into a support form,
      or a setup guide says `vendor login --email <your email>` and it obliges.
    default_mode: enforce
    enforce_rules: floor
    egress:
      enabled: true
      mode: enforce
      default: allow
    settings:
      data_boundary:
        enabled: true
        mode: enforce
        trusted_domains: []
        classes:
          ssn:
            internal: observe
            trusted: block
            external: block
            untrusted: block
            unknown: block
          card:
            internal: observe
            trusted: block
            external: block
            untrusted: block
            unknown: block
          iban:
            internal: observe
            trusted: block
            external: block
            untrusted: block
            unknown: block
          secret:
            trusted: warn
            external: block
            untrusted: block
            unknown: block
          email:
            trusted: observe
            external: redact
            untrusted: block
            unknown: step_up
          phone:
            trusted: observe
            external: redact
            untrusted: block
            unknown: step_up
          file:
            trusted: observe
            external: step_up
            untrusted: block
            unknown: step_up
        bulk_threshold: 3
        unknown_cli: step_up
    enforce_extra:
    - pii-exposure
    - db-access
    - db-modification
    - risky-write
    rules:
    - id: network-exfil-tool
      mode: observe
    - id: bulk-pii-exfiltration
      mode: enforce
      action: block
    - id: national-id-uk-nino
      severity: HIGH
      category: pii_exposure
      title: UK National Insurance number in an agent action
      event_types:
      - shell
      - file_write
      - network
      fields:
      - command
      - content
      - url
      - outbound_payload
      patterns:
      - \b[A-CEGHJ-PR-TW-Z]{2}\s?\d{2}\s?\d{2}\s?\d{2}\s?[A-D]\b
      action: block
    - id: mrn-medical-record-number
      severity: HIGH
      category: pii_exposure
      title: Medical record number pattern in an agent action
      event_types:
      - shell
      - file_write
      - network
      fields:
      - command
      - content
      - url
      - outbound_payload
      patterns:
      - \b(?:MRN|mrn)[-_:\s#]{0,3}\d{6,10}\b
      action: block
    reward:
      - "Regulated IDs       : SSN, PAN and IBAN cannot leave, at any tier."
      - "Contact data        : redacted out of external calls, not blocked."
      - "Bulk egress         : three distinct values of a class is a dataset."
      - "Vendor carve-outs   : your mail/CRM vendors keep working by design."
    friction:
      - "Unknown CLIs        : a destination not readable from argv needs approval."
      - "Whole-file sends    : uploading a file externally asks a human first."
      - "Regional IDs        : the shipped patterns are examples, not your formats."
    residual_risk: >-
      Anything the classifier does not recognise as sensitive. Detection is
      pattern-based, so an internal customer identifier, a free-text clinical
      note or a photograph of a form all pass unremarked, and `trusted_domains`
      is a promise you make about a host rather than a property Prismor can
      check. Fill it in before trusting the tier logic — without it every one
      of your own services scores `external`.
    friction_index: 45
    recommended_for: "Health, fintech and insurance repos; anything under a DPA."
    not_recommended_for: "Repos with no real personal data — the tiering is pure cost there."

  # ────────────────────────────────────────────────────────────────────────
  production-ops:
    name: "Production Ops"
    intent: "Real infrastructure credentials. Guards blast radius, not malware."
    scenario: >-
      An agent with a cloud profile, a kubeconfig, a Terraform backend or a
      production database URL in reach. The threat model inverts: there is no
      attacker in the usual case, there is a competent agent running a
      correct-looking command against the wrong environment with credentials
      that make it irreversible. So the rules cover the handful of verbs that
      cannot be undone, and stay out of the way everywhere else.
    default_mode: enforce
    enforce_rules: floor
    egress:
      enabled: true
      mode: enforce
      default: deny
      allow_private: true
      allow:
      - '*.amazonaws.com'
      - '*.googleapis.com'
      - '*.azure.com'
      - '*.windows.net'
      - '*.digitaloceanspaces.com'
      - '*.hashicorp.com'
      - registry.terraform.io
      - '*.github.com'
      - github.com
      - '*.datadoghq.com'
      - '*.pagerduty.com'
      - hooks.slack.com
      - api.anthropic.com
      - api.openai.com
    tool_tags:
      enabled: true
      mode: enforce
      inference_enabled: false
      rules:
      - untrusted_content then critical_action -> block
    settings:
      inspect_execution_targets: true
      execution_target_action: enforce
      data_boundary:
        enabled: true
        mode: enforce
    enforce_extra:
    - db-modification
    - cloud-metadata-ssrf
    - container-escape
    rules:
    - id: db-access
      mode: enforce
      action: block
    - id: terraform-destroy
      severity: CRITICAL
      category: destructive_command
      title: Terraform destroy or unreviewed auto-approve
      event_types:
      - shell
      fields:
      - command
      patterns:
      - \bterraform\s+(?:-[^\s]+\s+)*destroy\b
      - \bterraform\s+(?:-[^\s]+\s+)*apply\b[^\n]*\s-auto-approve\b
      - \bterraform\s+state\s+rm\b
      - \bterragrunt\s+(?:run-all\s+)?destroy\b
      action: block
    - id: k8s-prod-destructive
      severity: CRITICAL
      category: destructive_command
      title: Destructive kubectl against a production-named context or namespace
      event_types:
      - shell
      fields:
      - command
      patterns:
      - \bkubectl\b[^\n]*\s(?:--context|--namespace|-n)[=\s]+[^\s]*(?:prod|production)[^\s]*[^\n]*\s(?:delete|drain|cordon)\b
      - \bkubectl\s+delete\b[^\n]*\s(?:--all|--all-namespaces)\b
      - \bkubectl\s+delete\s+(?:namespace|ns)\s+[^\s]*(?:prod|production)
      - \bhelm\s+(?:uninstall|delete)\b[^\n]*[^\s]*(?:prod|production)
      action: block
    - id: cloud-terminate-resources
      severity: CRITICAL
      category: destructive_command
      title: Cloud CLI deleting or terminating live resources
      event_types:
      - shell
      fields:
      - command
      patterns:
      - \baws\s+ec2\s+terminate-instances\b
      - \baws\s+rds\s+delete-db-(?:instance|cluster)\b
      - \baws\s+s3\s+rb\b[^\n]*--force\b
      - \baws\s+s3\s+rm\b[^\n]*\s--recursive\b
      - \baws\s+iam\s+delete-(?:user|role|policy)\b
      - \bgcloud\s+(?:compute\s+instances|sql\s+instances)\s+delete\b
      - \baz\s+(?:vm|group)\s+delete\b
      action: block
    - id: prod-db-drop
      severity: CRITICAL
      category: db_modification
      title: Schema-destroying SQL against a production-named target
      event_types:
      - shell
      fields:
      - command
      patterns:
      - (?:psql|mysql|mongo|mongosh|redis-cli)\b[^\n]*(?:prod|production)[^\n]*\b(?:DROP|TRUNCATE|DELETE\s+FROM)\b
      - \b(?:DROP\s+(?:DATABASE|SCHEMA|TABLE)|TRUNCATE\s+TABLE)\b[^\n]*(?:prod|production)
      - \bprisma\s+migrate\s+reset\b
      - \bflushall\b|\bFLUSHALL\b
      action: block
    - id: git-remote-hijack
      mode: observe
    - id: network-exfil-tool
      mode: observe
    - id: git-history-rewrite-protected
      severity: HIGH
      category: destructive_command
      title: Force-push or history rewrite on a protected branch
      event_types:
      - shell
      fields:
      - command
      patterns:
      - \bgit\s+push\b[^\n]*(?:--force(?!-with-lease)|\s-f\b)[^\n]*\b(?:main|master|release|production)\b
      - \bgit\s+push\b[^\n]*\s--delete\b[^\n]*\b(?:main|master|release|production)\b
      action: block
    reward:
      - "Irreversible verbs  : destroy, terminate, drop and force-push blocked."
      - "Environment split   : prod-named targets blocked, staging untouched."
      - "Wrapper scripts     : `./deploy.sh` is screened by what it runs."
      - "Metadata pivot      : the IMDS credential endpoint stays denied."
    friction:
      - "Unlisted hosts      : an internal service not on the list is unreachable."
      - "Naming convention   : the rules key on `prod`/`production` literally."
      - "Reads are free      : plan, get, logs and describe are untouched."
    residual_risk: >-
      Every destructive verb whose target is not named the way these patterns
      expect. An environment called `live`, `p0` or a bare account id matches
      nothing here, and the rules read the command, not the credentials — an
      agent pointed at production through an already-selected kubectl context
      or an `AWS_PROFILE` in the environment looks identical to one pointed at
      staging. Edit the alternations before relying on this.
    friction_index: 30
    recommended_for: "SRE and platform agents holding cloud, k8s or DB credentials."
    not_recommended_for: "Application development — the ops rules match nothing there."

  # ────────────────────────────────────────────────────────────────────────
  oss-maintainer:
    name: "OSS Maintainer"
    intent: "Public repo. Supply chain and contributor content, quiet elsewhere."
    scenario: >-
      Reviewing contributor pull requests, triaging issues, adding
      dependencies, running the suite on someone else's branch. Deliberately
      the quietest mode here: a maintainer merging a docs typo should not
      notice it. It stops two things — a dependency that should not be
      installed, and contributor-supplied text acting as instructions.
    default_mode: observe
    enforce_rules: floor
    egress:
      enabled: true
      mode: observe
      default: allow
    tool_tags:
      enabled: true
      mode: enforce
      inference_enabled: false
      rules:
      - untrusted_content then critical_action -> block
      - untrusted_content then egress.denied -> block
    settings:
      supply_chain_install_check: true
      supply_chain_transitive_scan: true
      inspect_execution_targets: true
      execution_target_action: observe
      semantic_guard:
        enabled: true
        mode: auto
    enforce_extra:
    - cloud-metadata-ssrf   # egress is observe in this mode, so the rule carries it
    - pkg-install-from-url
    - pkg-suspicious-name
    - pkg-postinstall-script
    - dependency-confusion
    - npm-git-install
    - lockfile-direct-edit
    - lockfile-deletion
    - execute-vendored-script
    - package-registry-poisoning
    - prompt-injection
    - prompt-injection-hidden
    - skill-exfil-url
    - skill-encoded-payload
    - skill-shell-injection
    - skill-dynamic-import
    - skill-prompt-override
    - secret-access
    - credential-aggregation
    - git-remote-hijack
    - persistence-git-hooks
    reward:
      - "Dependency integrity: typosquats, URL and git-ref installs blocked."
      - "Registry repointing : `npm config set registry` is blocked."
      - "Contributor content : injected instructions in a PR or skill blocked."
      - "Publish tokens      : reads of npm/PyPI credentials are blocked."
    friction:
      - "Adding a dependency : anything outside the lockfile is refused."
      - "Vendored scripts    : running a checked-in installer is blocked."
      - "Security fixtures   : an adversarial test corpus trips the injection rules."
    residual_risk: >-
      Code the maintainer runs on purpose. A contributor's malicious change to
      a build script, a test helper or a CI workflow executes with the
      maintainer's reach the moment the suite runs, and nothing here reads a
      diff for intent. This mode raises the cost of getting a package in; it
      does not review the pull request.
    friction_index: 15
    recommended_for: "Public repos, contributor PR review, release maintenance."
    not_recommended_for: "Private repos with production access — too quiet."
