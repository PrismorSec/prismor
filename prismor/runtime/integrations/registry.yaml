# Prismor — integration registry
#
# Machine-readable map of every agent / framework Prismor can intercept, the
# surface it exposes, and how blocking works there. This is the source of truth
# for the coverage tables in AGENT_INTEGRATIONS.md (regenerated by
# scripts/gen_integration_matrix.py) and for runtime adapter wiring.
#
# Fields:
#   id          stable identifier (matches _SUPPORTED_AGENTS / adapter agent name)
#   name        human-readable name
#   kind        coding-agent | framework
#   surface     hook-config | sdk | mcp | rules-only
#   status      shipped | roadmap | sweep-only
#   config_paths   {project, user, system} config locations (where applicable)
#   events      lifecycle events hooked
#   blocking    exit-2 | json-permission | throw | proxy-deny | none
#   normalizer  prismor/runtime/hooks.py function (coding agents) or adapter module (frameworks)
#   sweep_dir   config dir scanned by `immunity sweep` (optional)
#   sources     authoritative URLs
#
# Validate with: scripts/verify_registry.sh

schema: prismor.runtime.integrations.v1

agents:
  # ── Coding agents — shipped ──────────────────────────────────────────────
  - id: claude
    name: Claude Code
    kind: coding-agent
    surface: hook-config
    status: shipped
    config_paths: { project: ".claude/settings.json", user: "~/.claude/settings.json" }
    events: [UserPromptSubmit, PreToolUse, PostToolUse]
    blocking: exit-2
    normalizer: _normalize_claude
    sweep_dir: "~/.claude/"
    sources: ["https://docs.claude.com/en/docs/claude-code/hooks"]
    mirror:
      status: verified
      scope: project
      disable: "permissions.deny in .claude/settings.json"
      verified: "2026-08-19"

  - id: cursor
    name: Cursor
    kind: coding-agent
    surface: hook-config
    status: shipped
    config_paths: { project: ".cursor/hooks.json" }
    events: [beforeSubmitPrompt, beforeShellCommand, afterShellCommand, beforeFileWrite, afterFileWrite]
    blocking: json-permission
    normalizer: _normalize_cursor
    sweep_dir: "~/.config/Cursor/"
    sources: ["https://cursor.com/docs/agent/hooks"]
    mirror:
      status: possible
      scope: project
      disable: "permissions.deny"
      notes: "accepted in config, not runtime-verified"

  - id: windsurf
    name: Windsurf (Codeium Cascade)
    kind: coding-agent
    surface: hook-config
    status: shipped
    config_paths: { project: ".windsurf/hooks.json", user: "~/.codeium/windsurf/hooks.json" }
    events: [pre_user_prompt, pre_read_code, post_read_code, pre_write_code, post_write_code, pre_run_command, post_run_command, pre_mcp_tool_use, post_mcp_tool_use, post_cascade_response]
    blocking: json-permission
    normalizer: _normalize_windsurf
    sweep_dir: "~/.codeium/"
    sources: ["https://docs.windsurf.com/windsurf/cascade/hooks"]

  - id: openclaw
    name: OpenClaw
    kind: coding-agent
    surface: hook-config
    status: shipped
    config_paths: { user: "~/.openclaw/config.json" }
    events: [before_tool_call, message_sending, "message:received"]
    blocking: throw
    normalizer: _normalize_openclaw
    sweep_dir: "~/.openclaw/"
    sources: ["internal"]

  - id: hermes
    name: Hermes (NousResearch gateway)
    kind: coding-agent
    surface: hook-config
    status: shipped
    config_paths: { user: "~/.hermes/config.json" }
    events: [before_tool_call, message_sending, "message:received"]
    blocking: throw
    normalizer: _normalize_hermes
    sweep_dir: "~/.hermes/"
    sources: ["internal"]

  - id: codex
    name: Codex (OpenAI)
    kind: coding-agent
    surface: hook-config
    status: shipped
    config_paths: { project: ".codex/hooks.json", user: "~/.codex/hooks.json" }
    events: [UserPromptSubmit, PreToolUse, PermissionRequest, PostToolUse]
    blocking: exit-2
    normalizer: _normalize_codex
    sweep_dir: "~/.codex/"
    notes: "Requires codex-cli >= 0.141.0-alpha.1 for working hooks."
    sources: ["https://developers.openai.com/codex/hooks"]
    mirror:
      status: verified
      scope: machine
      disable: "features.shell_tool=false + features.unified_exec=false"
      verified: "2026-08-19"
      notes: "user-level config only; mirrored calls need a sandbox mode that permits them"

  - id: copilot
    name: GitHub Copilot CLI
    kind: coding-agent
    surface: hook-config
    status: shipped
    config_paths: { project: ".github/hooks/prismor.json", user: "~/.copilot/hooks/prismor.json" }
    events: [UserPromptSubmit, PreToolUse, PostToolUse]
    blocking: json-permission
    normalizer: _normalize_copilot
    sources: ["https://docs.github.com/en/copilot/reference/hooks-configuration"]
    mirror:
      status: unsupported
      notes: "per-command deny only, no first-class disablement"

  - id: grok
    name: Grok Build (xAI)
    kind: coding-agent
    surface: hook-config
    status: shipped
    config_paths: { project: ".grok/hooks/prismor.json", user: "~/.grok/hooks/prismor.json" }
    events: [UserPromptSubmit, PreToolUse, PostToolUse]
    blocking: exit-2
    normalizer: _normalize_grok
    sweep_dir: "~/.grok/"
    notes: "Also natively reads .claude/settings.json and .cursor/hooks.json. Tool-name matchers assume Claude-Code-compatible tool names (Bash/Read/Edit/Write/...) by analogy; not yet verified against a live grok binary."
    sources: ["https://docs.x.ai/build/features/hooks", "https://docs.x.ai/build/overview"]
    mirror:
      status: possible
      scope: machine
      disable: "--disallowed-tools"
      notes: "flags exist, not runtime-verified"

  - id: kiro
    name: Kiro CLI (AWS)
    kind: coding-agent
    surface: hook-config
    status: shipped
    config_paths: { project: ".kiro/agents/kiro_default.json", user: "~/.kiro/agents/kiro_default.json" }
    events: [userPromptSubmit, preToolUse, postToolUse]
    blocking: exit-2
    normalizer: _normalize_kiro
    sweep_dir: "~/.kiro/"
    notes: "Hooks live inside a named agent config, not a dedicated hooks file. Kiro's merge-vs-replace semantics for a partial kiro_default.json override are undocumented, so a fresh install seeds a self-contained config (explicit tools list included) rather than a hooks-only fragment. Not yet verified against a live kiro-cli binary."
    sources: ["https://kiro.dev/docs/cli/hooks/", "https://kiro.dev/docs/cli/custom-agents/configuration-reference/", "https://github.com/Ar9av/agent-manual/blob/main/tools/kiro/README.md"]
    mirror:
      status: possible
      scope: project
      disable: "custom-agent allowedTools"
      notes: "from docs, not live-tested"

  - id: crush
    name: Crush (Charmbracelet)
    kind: coding-agent
    surface: hook-config
    status: shipped
    config_paths: { project: "crush.json", user: "~/.config/crush/crush.json" }
    events: [PreToolUse]
    blocking: exit-2
    normalizer: _normalize_crush
    sweep_dir: "~/.config/crush/"
    notes: "Verified live (2026-07, crush v0.86.x): PreToolUse is the only hookable event (no PostToolUse/UserPromptSubmit hook surface exists despite the SDK's generic HookConfig type); a deny reason must come from stderr on exit 2, NOT a {\"decision\":\"block\"} stdout envelope (that shape is silently ignored — a different convention than several other agents in this table). Shell tool name is \"bash\"."
    sources: ["https://github.com/charmbracelet/crush", "https://github.com/Ar9av/agent-manual/blob/main/tools/crush/README.md"]
    mirror:
      status: possible
      scope: project
      disable: "options.disabled_tools"

  - id: openhands
    name: OpenHands
    kind: coding-agent
    surface: hook-config
    status: shipped
    config_paths: { project: ".openhands/hooks.json" }
    events: [PreToolUse, UserPromptSubmit]
    blocking: exit-2
    normalizer: _normalize_openhands
    sweep_dir: "~/.openhands/"
    notes: "Verified live (2026-07, openhands v1.21.0): PreToolUse fires and a non-zero exit genuinely blocks the tool call. Shell tool name is \"terminal\" (not \"execute_bash\"). Payload's event-name field is \"event_type\", NOT \"hook_event_name\" like the Claude/Codex-family agents — a real schema difference, not a typo. No documented global/user-level hooks.json path exists; a \"global\"-scope install falls back to ~/.openhands/hooks.json (matches where other OpenHands global state lives) but this is unverified."
    sources: ["https://docs.openhands.dev/", "https://github.com/Ar9av/agent-manual/blob/main/tools/openhands/README.md"]
    mirror:
      status: unsupported
      notes: "include_default_tools is SDK-only, not exposed by the CLI"

  - id: qwen
    name: Qwen Code (Alibaba)
    kind: coding-agent
    surface: hook-config
    status: shipped
    config_paths: { project: ".qwen/settings.json", user: "~/.qwen/settings.json" }
    events: [UserPromptSubmit, PreToolUse, PostToolUse]
    blocking: json-permission
    normalizer: _normalize_qwen
    sweep_dir: "~/.qwen/"
    notes: "Hooks schema is Claude-Code-shaped (hookSpecificOutput.permissionDecision), but Qwen Code's own tool ids -- verified live (2026-07, qwen-code v0.20.1) the shell tool is \"run_shell_command\", NOT \"Bash\"; a matcher of \"Bash\" silently never fires. Deny is a NESTED stdout envelope ({\"hookSpecificOutput\":{\"hookEventName\":...,\"permissionDecision\":\"deny\",...}}), unlike Copilot's flat shape — needs its own cli.py branch, not the generic exit-2 or Copilot's json-permission path. Non-interactive (`-p`) runs require `-y`/`--yolo` for the shell tool to execute at all; without it, a small model may narrate a plausible-sounding fake result instead of genuinely failing, which can look like (but is not) a hook problem."
    sources: ["https://qwenlm.github.io/qwen-code-docs/en/users/features/hooks/", "https://github.com/Ar9av/agent-manual/blob/main/tools/qwen-code/README.md"]
    mirror:
      status: possible
      scope: machine
      disable: "coreTools / excludeTools"
      notes: "from docs, not live-tested"

  - id: continue
    name: Continue CLI
    kind: coding-agent
    surface: hook-config
    status: shipped
    config_paths: { project: ".continue/settings.json", user: "~/.continue/settings.json" }
    events: [UserPromptSubmit, PreToolUse, PostToolUse]
    blocking: exit-2
    normalizer: _normalize_continue
    sweep_dir: "~/.continue/"
    notes: "WARNING — verified live (2026-07, cn v1.5.47): hooks configured exactly per this (Claude-Code-compatible) schema, in every documented config location (project/global, custom/default config path), did NOT fire in headless (`cn -p`) mode for ANY event, including UserPromptSubmit which needs no tool call at all. Traced to runHeadlessMode() in the CLI's own source, which does call initializeServices() before running the prompt, so this isn't an obvious ordering bug — root cause not fully pinned down. Shipped anyway (interactive-mode users may still be covered; this config is inert, not harmful, if the bug is present) but do not treat an installed Continue CLI hook as confirmed-active without testing it in your actual invocation mode first."
    sources: ["https://docs.continue.dev/cli/quickstart", "https://github.com/Ar9av/agent-manual/blob/main/tools/continue-cli/README.md"]

  - id: goose
    name: Goose (Agentic AI Foundation)
    kind: coding-agent
    surface: hook-config
    status: shipped
    config_paths: { project: ".agents/plugins/prismor/hooks/hooks.json", user: "~/.agents/plugins/prismor/hooks/hooks.json" }
    events: [PreToolUse, UserPromptSubmit]
    blocking: exit-2
    normalizer: _normalize_goose
    sweep_dir: "~/.config/goose/"
    notes: "Plugin-directory based (Open Plugins spec) — goose auto-discovers any dir under .../plugins/<name>/ containing hooks/hooks.json, no central plugin-registration list to append to (unlike OpenClaw/Hermes). A static plugin.json manifest is scaffolded once alongside it. Verified live (2026-07, goose v1.44.0): the built-in shell tool's real name is \"shell\" — NOT \"developer__shell\" as goose's own official docs example shows; a matcher of \"developer__shell\" silently never fires. Payload's event-name field is \"event\", not \"hook_event_name\"."
    sources: ["https://goose-docs.ai/docs/guides/context-engineering/hooks", "https://github.com/Ar9av/agent-manual/blob/main/tools/goose/README.md"]

  # ── Coding agents — roadmap (hook surface exists, adapter not built) ──────
    mirror:
      status: possible
      scope: machine
      disable: "disable each built-in extension individually"
      notes: "seven separate extensions to turn off"
  - id: gemini
    name: Gemini CLI (Google)
    kind: coding-agent
    surface: hook-config
    status: roadmap
    config_paths: { project: ".gemini/settings.json", user: "~/.gemini/settings.json", system: "/etc/gemini-cli/settings.json" }
    events: [BeforeTool, AfterTool, BeforeAgent, AfterAgent, BeforeModel, BeforeToolSelection, AfterModel, SessionStart, SessionEnd]
    blocking: exit-2
    normalizer: null
    sources: ["https://geminicli.com/docs/hooks/reference/"]
    mirror:
      status: possible
      scope: machine
      disable: "tools.core / tools.exclude"
      notes: "from docs, not live-tested"

  - id: opencode
    name: OpenCode
    kind: coding-agent
    surface: sdk
    status: shipped
    config_paths: { project: ".opencode/plugins/", user: "~/.config/opencode/plugins/" }
    events: ["tool.execute.before", "tool.execute.after"]
    blocking: throw
    normalizer: _normalize_opencode
    sources: ["https://opencode.ai/docs/plugins/"]
    mirror:
      status: verified
      scope: project
      disable: "tools.<name>: false"
      verified: "2026-08-19"
      notes: "no trust gate - the project opencode.json both declares and grants the server"

  - id: factory-droid
    name: Factory Droid
    kind: coding-agent
    surface: hook-config
    status: roadmap
    config_paths: { project: ".factory-plugin/hooks/hooks.json", user: "~/.factory/" }
    events: [PreToolUse, PostToolUse]
    blocking: json-permission
    normalizer: null
    sources: ["https://docs.factory.ai/reference/hooks-reference"]
    mirror:
      status: possible
      scope: machine
      disable: "--restrict-tools (per-invocation only)"
      notes: "not persistent, so it cannot be enforced from config"

  - id: pi-agent
    name: Pi Coding Agent
    kind: coding-agent
    surface: hook-config
    status: roadmap
    config_paths: { project: ".pi/hook/hooks.yaml", user: "~/.pi/agent/hook/hooks.yaml" }
    events: ["tool.before.*", "tool.after.*", "session.created"]
    blocking: exit-2
    normalizer: null
    notes: "Requires the community pi-yaml-hooks package (`pi install npm:pi-yaml-hooks`) — Pi has no built-in hooks.json of its own. Project-scope hooks additionally require trust (PI_YAML_HOOKS_TRUST_PROJECT=1 or a trusted-projects.json entry) before they load. CAUTION, verified live (2026-07, pi-coding-agent v0.81.1): hook firing and unconditional exit-2 blocking both work, but the documented ways to read the triggering command inside a hook — a $TOOL_INPUT env var, and {{tool_input}}/{{command}} mustache templating — were BOTH non-functional in testing (empty/unsubstituted). A real integration here could only do blanket policy (block everything matching an event), not command-aware policy, until the correct mechanism for reading tool input is found."
    sources: ["https://github.com/earendil-works/pi", "https://github.com/Ar9av/agent-manual/blob/main/tools/pi-agent/README.md"]
    mirror:
      status: possible
      scope: machine
      disable: "first-class disable flags"
      notes: "MCP itself is a third-party adapter, not first-party"

  - id: amazon-q
    name: Amazon Q Developer CLI (AWS)
    kind: coding-agent
    surface: hook-config
    status: roadmap
    config_paths: { project: ".amazonq/cli-agents/*.json", user: "~/.aws/amazonq/cli-agents/*.json" }
    events: [agentSpawn, userPromptSubmit, preToolUse, postToolUse, stop]
    blocking: exit-2
    normalizer: null
    notes: "Hooks live inside a named per-agent JSON config (like Kiro), not a dedicated hooks file — merging in a Prismor hook means editing whichever agent config is active, same structural complexity as Kiro's kiro_default.json. Only preToolUse blocks; deny is a plain exit-2 + stderr text, no structured JSON decision object (simpler than Claude-family agents, but also less expressive — no ask/modify verdict support). AWS has marked the underlying open-source CLI unmaintained (critical-fixes-only) in favor of the closed-source Kiro CLI, which Prismor already ships support for — that may make this lower priority than its own coverage gap suggests."
    sources: ["https://docs.aws.amazon.com/amazonq/latest/qdeveloper-ug/command-line-installing.html", "https://github.com/Ar9av/agent-manual/blob/main/tools/amazon-q-dev-cli/README.md"]
    mirror:
      status: possible
      scope: machine
      disable: "custom-agent tools array"
      notes: "from docs, not live-tested"

  - id: amp
    name: Amp (Sourcegraph spinoff)
    kind: coding-agent
    surface: sdk
    status: roadmap
    config_paths: { project: ".amp/plugins/*.ts", user: "~/.config/amp/plugins/*.ts" }
    events: ["tool.call", "agent.start", "agent.end"]
    blocking: throw
    normalizer: null
    notes: "No declarative hooks.json — extensibility is a TypeScript Plugin API (async function receiving a context, returning handlers keyed by event name). Architecturally closer to OpenCode's plugin model than to the JSON-hooks agents in this table: a real integration would need a scaffolded .ts plugin (like the OpenClaw/Hermes JS scaffolds) that shells out to the prismor dispatcher and returns a reject action, not a config-merge. Not yet verified against a live amp install."
    sources: ["https://ampcode.com/manual/plugin-api", "https://github.com/Ar9av/agent-manual/blob/main/tools/amp/README.md"]
    mirror:
      status: possible
      scope: machine
      disable: "amp.permissions reject rules"

  - id: auggie
    name: Auggie CLI (Augment Code)
    kind: coding-agent
    surface: hook-config
    status: roadmap
    config_paths: { project: ".augment/settings.json", user: "~/.augment/settings.json" }
    events: [PreToolUse, PostToolUse, Stop, SessionStart, SessionEnd]
    blocking: exit-2
    normalizer: null
    notes: "Documented as a JSON settings.json with a top-level hooks key, command-type handlers only — same shape family as Claude/Codex. Not yet verified against a live auggie install (this repo's own live-testing pass covered Goose/Crush/Continue/OpenHands/Codex/Aider/OpenCode/Pi Agent/Qwen Code/OpenClaw but not Auggie)."
    sources: ["https://docs.augmentcode.com/cli/hooks", "https://github.com/Ar9av/agent-manual/blob/main/tools/auggie/README.md"]
    mirror:
      status: possible
      scope: machine
      disable: "auggie tools remove"

  - id: kimi-code
    name: Kimi Code (Moonshot AI)
    kind: coding-agent
    surface: hook-config
    status: roadmap
    config_paths: { project: ".kimi-code/local.toml", user: "~/.kimi-code/config.toml" }
    events: [PreToolUse, PostToolUse, UserPromptSubmit, SessionStart, SessionEnd, Stop, SubagentStart, SubagentStop]
    blocking: exit-2
    normalizer: null
    notes: "TOML config like Codex, not JSON — a real integration would follow Codex's config.toml text-patch approach (_ensure_codex_hooks_feature_enabled) rather than the JSON read/merge/write path most other agents use. Not yet verified against a live kimi-code install."
    sources: ["https://www.kimi.com/code/docs/en/kimi-code-cli/", "https://github.com/Ar9av/agent-manual/blob/main/tools/kimi-code/README.md"]
    mirror:
      status: possible
      scope: machine
      disable: "[permission].deny + agent-profile allowlist"

  - id: devin
    name: Devin CLI (Cognition AI)
    kind: coding-agent
    surface: hook-config
    status: roadmap
    config_paths: { project: ".devin/hooks.v1.json", user: "~/.config/devin/hooks.v1.json" }
    events: [SessionStart, SessionEnd, UserPromptSubmit, PreToolUse, PostToolUse, PermissionRequest, Stop, PostCompaction]
    blocking: exit-2
    normalizer: null
    notes: "Hooks format explicitly mirrors Claude Code's (own docs note hooks from Claude Code projects often work directly) — the Claude merge/strip/normalize logic in this file would very likely need only path + minor field-name changes to port. Devin also requires new (non-managed) hooks to be interactively trusted before first execution, similar to Codex's hook-trust model. Not yet verified against a live devin install."
    sources: ["https://docs.devin.ai/cli/extensibility/hooks/overview", "https://github.com/Ar9av/agent-manual/blob/main/tools/devin-cli/README.md"]

  # ── Sweep / rules-only — no programmable pre-tool hook ────────────────────
    mirror:
      status: possible
      scope: machine
      disable: "permissions.deny (documented)"
      notes: "not runtime-verified"
  - id: antigravity
    name: Google Antigravity
    kind: coding-agent
    surface: rules-only
    status: sweep-only
    config_paths: { user: "~/.antigravity/" }
    events: []
    blocking: none
    normalizer: null
    sweep_dir: "~/.antigravity/"
    sources: ["https://discuss.ai.google.dev/t/hooks-in-antigravity/120458"]
    mirror:
      status: unsupported
      notes: "no disablement mechanism found"

  - id: aider
    name: Aider
    kind: coding-agent
    surface: rules-only
    status: sweep-only
    config_paths: { project: ".aider.conf.yml", user: "~/.aider/" }
    events: []
    blocking: none
    normalizer: null
    sweep_dir: "~/.aider/"
    sources: ["https://aider.chat/docs/config/options.html"]
    mirror:
      status: unsupported
      notes: "no MCP support at all"

  - id: trae
    name: Trae / Trae CN (ByteDance)
    kind: coding-agent
    surface: rules-only
    status: sweep-only
    config_paths: { project: ".trae/rules/", user: "~/.trae/" }
    events: []
    blocking: none
    normalizer: null
    sweep_dir: "~/.trae/"
    sources: ["https://docs.trae.ai/ide/rules?_lang=en"]
    mirror:
      status: unsupported
      notes: "GUI only; disablement inferred, never confirmed"

  - id: warp
    name: Warp (Agent Mode)
    kind: coding-agent
    surface: rules-only
    status: sweep-only
    config_paths: { project: ".warp/", user: "~/.warp/" }
    events: []
    blocking: none
    normalizer: null
    sweep_dir: "~/.warp/"
    notes: "Primarily a GUI terminal app (not an install-anywhere CLI); its own docs describe no lifecycle-event/hook system, only Agent Profiles/Permissions and command/MCP allow-deny lists. Rules files (WARP.md/AGENTS.md) and MCP config (.warp/.mcp.json) are the only sweepable static surface."
    sources: ["https://docs.warp.dev/agent-platform/", "https://github.com/Ar9av/agent-manual/blob/main/tools/warp/README.md"]
    mirror:
      status: unsupported
      notes: "no native-tool removal, only ask/allow friction tiers"

  - id: kilocode
    name: Kilocode
    kind: coding-agent
    surface: rules-only
    status: sweep-only
    config_paths: { project: ".kilocode/rules/", user: "~/.kilocode/" }
    events: ["session.chat.before"]
    blocking: none
    normalizer: null
    sweep_dir: "~/.kilocode/"
    notes: "Soft only — can inject a guardrail prompt, cannot veto a tool call."
    sources: ["https://deepwiki.com/Kilo-Org/kilocode/6.3-tool-filtering-and-permissions"]

  # ── Production frameworks — in-process SDK adapters ──────────────────────
    mirror:
      status: possible
      scope: project
      disable: "tools + permission block in kilo.jsonc"
  - id: openai-agents
    name: OpenAI Agents SDK
    kind: framework
    surface: sdk
    status: shipped
    config_paths: {}
    events: [tool_call]
    blocking: throw
    normalizer: "prismor_openai"
    notes: "In-process tool wrapper / guardrail. pip install \"prismor[openai-agents]\"."
    sources: ["https://openai.github.io/openai-agents-python/"]

  - id: crewai
    name: CrewAI
    kind: framework
    surface: sdk
    status: shipped
    config_paths: {}
    events: [tool_call]
    blocking: throw
    normalizer: "prismor_crewai"
    notes: "In-process tool wrapper (func/_run/run). pip install \"prismor[crewai]\"."
    sources: ["https://docs.crewai.com/"]

  - id: langchain
    name: LangChain / LangGraph
    kind: framework
    surface: sdk
    status: shipped
    config_paths: {}
    events: [on_tool_start, on_tool_end]
    blocking: throw
    normalizer: "prismor_langchain"
    notes: "Tool wrapper + PrismorCallbackHandler. pip install \"prismor[langchain]\"."
    sources: ["https://python.langchain.com/docs/concepts/callbacks/"]

  - id: browser-use
    name: browser-use
    kind: framework
    surface: sdk
    status: shipped
    config_paths: {}
    events: [go_to_url, click_element, input_text, search_google, open_tab, upload_file, save_pdf, extract_content]
    blocking: throw
    normalizer: "prismor_browser_use"
    notes: "Patches Registry.execute_action — single dispatch point for all browser actions. go_to_url/search_google → network event; upload_file/save_pdf → file_write; everything else → shell. pip install \"prismor[browser-use]\"."
    sources: ["https://github.com/browser-use/browser-use"]

  - id: pydantic-ai
    name: Pydantic AI
    kind: framework
    surface: sdk
    status: shipped
    config_paths: {}
    events: [call_tool]
    blocking: throw
    normalizer: "prismor_pydantic_ai"
    notes: "PrismorToolset(WrapperToolset) overrides call_tool(name, tool_args, ctx, tool) — the single choke point every tool call passes through. Deny raises ToolFailed (definitive failure, no retry-budget consumption) by default, or PrismorBlocked with raise_on_block=True. Verified live (2026-07) against a real `openai:gpt-4o-mini` Agent with a genuine OpenAI key: a destructive shell command was denied before the tool's Python implementation ever ran; a benign command executed normally. pip install \"prismor[pydantic-ai]\"."
    sources: ["https://ai.pydantic.dev/toolsets/", "https://ai.pydantic.dev/api/toolsets/"]

  - id: autogen-core
    name: AutoGen (Microsoft) — Core runtime
    kind: framework
    surface: sdk
    status: shipped
    config_paths: {}
    events: [on_send]
    blocking: throw
    normalizer: "prismor_autogen_core"
    notes: "PrismorInterventionHandler(DefaultInterventionHandler) overrides on_send(message, *, message_context, recipient), the real per-message gate every autogen-core AgentRuntime send passes through; tool calls arrive as FunctionCall messages en route to a ToolAgent. Deny raises ToolException by default (tool_agent_caller_loop specifically catches this and converts it to a failed FunctionExecutionResult fed back to the model — conversation continues); drop_instead_of_raise=True returns DropMessage instead. Verified live (2026-07) against a real SingleThreadedAgentRuntime + ToolAgent + tool_agent_caller_loop calling openai:gpt-4o-mini with a genuine OpenAI key: a destructive shell command was denied before the tool ever ran; a benign command executed normally. SCOPE CAVEAT (unchanged from roadmap): only covers the low-level autogen-core runtime — the high-level AgentChat AssistantAgent does not route tool execution through this same path. pip install \"prismor[autogen-core]\"."
    sources: ["https://microsoft.github.io/autogen/stable/user-guide/core-user-guide/cookbook/tool-use-with-intervention.html"]

  - id: agno
    name: Agno
    kind: framework
    surface: sdk
    status: shipped
    config_paths: {}
    events: [tool_hook]
    blocking: throw
    normalizer: "prismor_agno"
    notes: "tool_hooks list on Agent/Team (distinct from the singular pre_hook/post_hook). Hook signature (function_name, function_call, arguments) — Agno introspects and injects by param name; function_call is the callable that continues the chain, not a data object. Deny by raising (confirmed against source: the try/finally wrapper around hook calls only isolates message-list state, does not swallow exceptions) instead of calling function_call(**arguments). Verified live (2026-07) against a real Agent(model=OpenAIChat(id='gpt-4o-mini')) with a genuine OpenAI key: a destructive shell command was denied before the tool's Python implementation ever ran (Agno surfaced the RuntimeError as a tool error, model reported the block); a benign command executed normally. pip install \"prismor[agno]\"."
    sources: ["https://docs.agno.com/tools/hooks"]

  - id: semantic-kernel
    name: Semantic Kernel (Microsoft)
    kind: framework
    surface: sdk
    status: shipped
    config_paths: {}
    events: [auto_function_invocation]
    blocking: throw
    normalizer: "prismor_semantic_kernel"
    notes: "kernel.add_filter(FilterTypes.AUTO_FUNCTION_INVOCATION, filter_fn) where filter_fn(context, next) wraps the actual invocation; every filter composes into one middleware stack whose innermost link calls context.function.invoke(...). Deny by not calling await next(context) — cleanest gate-then-continue semantics of any framework in this table (Python confirmed; the .NET IAutoFunctionInvocationFilter equivalent was not independently re-verified in this pass). Sets a synthetic context.function_result so the model sees a coherent denied response. Verified live (2026-07) against a real Kernel + OpenAIChatCompletion(ai_model_id='gpt-4o-mini') with a genuine OpenAI key: a destructive shell command was denied before the tool's Python implementation ever ran; a benign command executed normally. pip install \"prismor[semantic-kernel]\"."
    sources: ["https://learn.microsoft.com/en-us/semantic-kernel/concepts/enterprise-readiness/filters"]

  - id: google-adk
    name: Google Agent Development Kit (ADK)
    kind: framework
    surface: sdk
    status: shipped
    config_paths: {}
    events: [before_tool_callback]
    blocking: throw
    normalizer: "prismor_google_adk"
    notes: "before_tool_callback(tool, args, tool_context) set on LlmAgent(before_tool_callback=fn) (or as a BasePlugin method, which take precedence over agent-level callbacks). Deny-by-substitution by default, not exception: returning None proceeds with the real tool call; returning a dict SKIPS tool execution and that dict becomes the result instead — the model never sees the tool actually run. raise_on_block=True raises PrismorBlocked instead. Verified live (2026-07) against a real LlmAgent using ADK's LiteLlm wrapper for openai/gpt-4o-mini with a genuine OpenAI key (pip install \"google-adk[extensions]\"): a destructive shell command was denied before the tool's Python implementation ever ran; a benign command executed normally. pip install \"prismor[google-adk]\"."
    sources: ["https://adk.dev/callbacks/types-of-callbacks/", "https://adk.dev/plugins/"]

  - id: mastra
    name: Mastra (TypeScript)
    kind: framework
    surface: sdk
    status: shipped
    config_paths: {}
    events: [execute]
    blocking: throw
    normalizer: "prismor-mastra (npm)"
    notes: "prismorTool()/prismorTools() wrap a tool's execute function directly (CrewAI/LangChain-style), calling the Prismor eval-server (surface: http sidecar, prismor eval-server --port 7071) before the body runs. CORRECTED FROM ROADMAP: the originally-planned processOutputStep + abort() hook was tested live and found NOT reliable — abort() throws a workflow-level error but the tool's execute function runs anyway regardless (confirmed with timestamped logging against a real agent run, @mastra/core v0.x, 2026-07). Direct execute-wrapping does reliably block, since the wrapped function is what Mastra actually calls. Verified live against a real Agent running gpt-4o-mini (via @ai-sdk/openai) with a genuine OpenAI key and a local eval-server: a destructive shell command was denied before the tool's JS implementation ever ran; a benign command executed normally. npm install prismor-mastra."
    sources: ["https://mastra.ai/reference/processors/processor-interface", "https://mastra.ai/docs/agents/processors"]

  - id: beeai
    name: BeeAI Framework (IBM Research / Linux Foundation)
    kind: framework
    surface: sdk
    status: shipped
    config_paths: {}
    events: ["start"]
    blocking: throw
    normalizer: "prismor_beeai"
    notes: "guard_tool()/guard_tools() subscribe a blocking listener to a Tool's Emitter \"start\" event (emitter.on(\"start\", handler, EmitterOptions(is_blocking=True))), fired by Tool.run() before self._run(...). Verified against source (not just docs, after the Mastra lesson): Emitter._invoke runs listeners as tasks inside asyncio.TaskGroup, which always awaits every task and re-raises on failure before the surrounding block exits — a listener that raises genuinely prevents the tool body from running. Deny raises a plain RuntimeError by default, or PrismorBlocked with raise_on_block=True. Verified live (2026-07) against a real ReActAgent (Python 3.13; beeai-framework's pydantic TypedDict config hits an unrelated pydantic/3.14 rebuild issue, unrelated to this adapter) running openai:gpt-4o-mini via ChatModel.from_name with a genuine OpenAI key: a destructive shell command was denied before the tool's _run ever executed; a benign command executed normally. pip install \"prismor[beeai]\"."
    sources: ["https://framework.beeai.dev/modules/emitter", "https://framework.beeai.dev/modules/middleware", "https://framework.beeai.dev/modules/agents/requirement-agent"]

  - id: claude-agent-sdk
    name: Claude Code Agent SDK
    kind: framework
    surface: sdk
    status: shipped
    config_paths: {}
    events: [PreToolUse]
    blocking: json-permission
    normalizer: "prismor_claude_agent_sdk"
    notes: "prismor_hook_matcher()/prismor_pre_tool_use_hook() register via HookMatcher(matcher=None, hooks=[cb]) on ClaudeAgentOptions.hooks — the same PreToolUse hooks system as the Claude Code CLI itself, exposed programmatically. Deny via hookSpecificOutput.permissionDecision: \"deny\", overriding even bypassPermissions mode. matcher defaults to None (match every tool call, not a fixed built-in-tool-name list) specifically because custom tools registered via create_sdk_mcp_server arrive as \"mcp__<server>__<tool>\" — a narrower default would silently exempt every custom/MCP tool from policy. VERIFICATION METHODOLOGY NOTE: unlike the OpenAI-key-backed adapters, this one requires genuine Anthropic auth to run at all, so it was live-tested (2026-07) on a separate host with an authenticated Claude Code CLI session (claude-agent-sdk shells out to the installed `claude` binary) rather than the shared OpenAI key. Naive destructive commands (rm -rf /, IMDS SSRF) turned out NOT to isolate the adapter — Claude's own alignment refuses those regardless of any hook, confirmed by a baseline run with zero Prismor hooks installed that also refused. Switched to a discriminating case instead: a benign-framed write to .claude/settings.json (Prismor's own agent-config-tampering CRITICAL rule) that Claude readily executes with no hook installed, and that the Prismor hook denies once installed — isolating the adapter's actual effect from the model's own judgment. An earlier version of this adapter's default matcher (\"Bash|Read|Edit|MultiEdit|Write|WebFetch|WebSearch\") silently never fired for the custom MCP tool used in testing; caught by this same discriminating test, not the naive rm -rf / case, which is why the naive case is an unreliable verification signal for this particular framework. First-run failure caveat: end-to-end verification depends on the target ClaudeAgentOptions.hooks wiring being correct in the caller's own app; this adapter's own hook logic is what was verified. pip install \"prismor[claude-agent-sdk]\"."
    sources: ["https://code.claude.com/docs/en/agent-sdk/hooks", "https://code.claude.com/docs/en/agent-sdk/permissions"]

